[workspace]
resolver = "2"
members = [
  "crates/babelfix",
  "crates/babelfix-core",
  "crates/babelfix-tokio",
  "crates/babelfix-repo",
  "crates/babelfix-repogen",
  "examples/fix-to-kafka",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Ben Jackson <puremourning@gmail.com>"]
repository = "https://github.com/puremourning/babelfix"

# `cargo release` configuration. All three crates share one version and are
# published together in dependency order (babelfix-repo -> babelfix-repogen ->
# babelfix); the internal `version = "..."` pins in [workspace.dependencies] are
# rewritten automatically on each bump. Only the umbrella crate is tagged, so a
# release produces a single `v{version}` tag (see the per-crate `tag = false`).
[workspace.metadata.release]
shared-version = true
tag-name = "v{{version}}"
pre-release-commit-message = "Release v{{version}}"

[workspace.dependencies]
anyhow = "1.0"
futures = "0.3"
async-stream = "0.3"
tokio = { version = "1.0", features = ["full"] }
babelfix = { path = "crates/babelfix", version = "0.1.0" }
babelfix-core = { path = "crates/babelfix-core", version = "0.1.0" }
babelfix-tokio = { path = "crates/babelfix-tokio", version = "0.1.0" }
babelfix-repo = { path = "crates/babelfix-repo", version = "0.1.0" }
babelfix-repogen = { path = "crates/babelfix-repogen", version = "0.1.0" }
tracing = "0.1"
bytes = "1.0"
tokio-util = { version = "0.7", features = ["codec"] }
chrono = { version = "0.4", features = ["serde"] }
criterion = { version = "0.8" }
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3.0", features = ["full"] }
thiserror = "2.0"
googletest = "0.14"
test-log = {version = "0.2", default-features = false, features = ["trace"]}
serde  = { version = "1.0", features = ["derive"] }
