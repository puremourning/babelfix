[package]
name = "babelfix"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "A production-grade FIX protocol implementation in Rust"
readme = "README.md"
categories = ["network-programming"]
keywords = ["fix-protocol", "financial", "fix", "trading"]

[features]
default = ["tokio"]
# The tokio transport. Turn it off for a build that carries only the sans-io
# core — though depending on `babelfix-core` directly is usually clearer.
tokio = ["dep:babelfix-tokio"]
serde = ["babelfix-core/serde", "babelfix-tokio?/serde"]

[dependencies]
babelfix-core.workspace = true
babelfix-tokio = { workspace = true, optional = true }

# The integration tests and benchmarks run against the umbrella crate, which is
# the surface applications actually use, so they double as a check that the
# facade re-exports everything it should.
[dev-dependencies]
criterion.workspace = true
anyhow.workspace = true
googletest.workspace = true
test-log.workspace = true
futures.workspace = true
tokio.workspace = true
tokio-util.workspace = true
bytes.workspace = true
chrono.workspace = true
tracing.workspace = true

[[bench]]
name = "message_benchmarks"
harness = false

[[bench]]
name = "channel_benchmarks"
harness = false
