[package]
name = "babelfix-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Sans-io core of the babelfix FIX engine: messages, codec and session state machine"
categories = ["network-programming"]
keywords = ["fix-protocol", "financial", "fix", "trading"]

[package.metadata.release]
tag = false

[features]
default = []
serde = ["dep:serde"]
## `FromFix`/`ToFix` impls for `decimix::Dec19` and `UDec19`.
decimix = ["dep:decimix"]
## `FromFix`/`ToFix` impls for the `decimix-finance` newtypes.
decimix-finance = ["decimix", "dep:decimix-finance"]

[dependencies]
thiserror.workspace = true
babelfix-repo.workspace = true
tracing.workspace = true
bytes.workspace = true
serde = { workspace = true, optional = true }
decimix = { version = "0.1.0", optional = true }
decimix-finance = { version = "0.1.0", optional = true }

# Deliberately NOT inherited from [workspace.dependencies], and deliberately
# `default-features = false`: that drops jiff's `std` feature, which is what
# gates `Timestamp::now()`, so no wall clock exists in this crate at all. The
# core never reads a wall clock — timestamps are handed to it by the driver.
# Enforcing that with the feature resolver beats enforcing it by code review.
#
# Note this only holds when the crate is built alone (`cargo build -p
# babelfix-core`); a `--workspace` build unifies features and hands `std` back.
# CI checks the standalone build for exactly this reason.
jiff = { version = "0.2", default-features = false, features = ["alloc"] }

[dev-dependencies]
# The schema depends on the core, not the other way round; the core's
# integration tests and doc examples use it. Path-only, so `cargo publish`
# strips it rather than requiring the schema to be published first.
babelfix-schema = { path = "../babelfix-schema" }
anyhow.workspace = true
googletest.workspace = true
test-log.workspace = true
