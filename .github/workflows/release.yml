name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release: an explicit SemVer (e.g. 0.2.0, no v prefix) or a bump level (patch, minor, major).'
        required: true
        type: string
      dry-run:
        description: Only report what would happen.
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # cargo-release (configured by [workspace.metadata.release]) bumps all five
  # crates together (shared-version), rewrites the internal path-dep version
  # pins, makes a single "Release vX.Y.Z" commit and tag, publishes
  # babelfix-repo -> babelfix-core -> babelfix-schema -> babelfix-tokio ->
  # babelfix in dependency order and pushes; then a GitHub release is created.
  release:
    uses: puremourning/rust-ci/.github/workflows/release.yml@v1
    with:
      version: ${{ inputs.version }}
      dry-run: ${{ inputs.dry-run }}
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
