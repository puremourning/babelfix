[package]
name = "babelfix-repo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Dual: our code is MIT; the bundled FIX Orchestra data (third-party/fix_orchestra)
# is Apache-2.0, so redistributors must satisfy both licenses.
license = "MIT AND Apache-2.0"
authors.workspace = true
repository.workspace = true
description = "FIX repository and Orchestra XML parsing for the babelfix FIX protocol implementation"

# Published by `cargo release` alongside the workspace, but the shared tag is
# created once by the umbrella `babelfix` crate.
[package.metadata.release]
tag = false

[dependencies]
proc-macro2.workspace = true
syn.workspace = true
quote.workspace = true
thiserror.workspace = true
quick-xml = "0.41"
include_dir = { version = "0.7", features = ["glob"] }
