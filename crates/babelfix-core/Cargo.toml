[package]
name = "babelfix-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Dual: our code is MIT; the typed schema `build.rs` generates (fields,
# message types, codesets) derives from the Apache-2.0 FIX Orchestra data, so
# redistributors must satisfy both licenses.
license = "MIT AND Apache-2.0"
authors.workspace = true
repository.workspace = true
description = "Sans-io core of the babelfix FIX engine: messages, codec and session state machine"
categories = ["network-programming"]
keywords = ["fix-protocol", "financial", "fix", "trading"]

[package.metadata.release]
tag = false

[features]
default = []
serde = ["dep:serde"]
## `FromFix`/`ToFix` impls for `decimix::Dec19` and `UDec19`.
decimix = ["dep:decimix"]
## `FromFix`/`ToFix` impls for the `decimix-finance` newtypes.
decimix-finance = ["decimix", "dep:decimix-finance"]

[dependencies]
thiserror.workspace = true
babelfix-repo.workspace = true
babelfix-repogen.workspace = true
tracing.workspace = true
bytes.workspace = true
serde = { workspace = true, optional = true }
decimix = { git = "https://github.com/puremourning/decimix", optional = true }
decimix-finance = { git = "https://github.com/puremourning/decimix", optional = true }

# Deliberately NOT inherited from [workspace.dependencies], and deliberately
# `default-features = false`: that drops chrono's `clock` (and hence `now`)
# feature, so `Utc::now()` does not exist in this crate at all. The core never
# reads a wall clock — timestamps are handed to it by the driver. Enforcing that
# with the feature resolver beats enforcing it by code review.
#
# Note this only holds when the crate is built alone (`cargo build -p
# babelfix-core`); a `--workspace` build unifies features and hands `now` back.
# CI checks the standalone build for exactly this reason.
chrono = { version = "0.4", default-features = false, features = ["std"] }

[build-dependencies]
babelfix-repo.workspace = true

[dev-dependencies]
anyhow.workspace = true
googletest.workspace = true
test-log.workspace = true
