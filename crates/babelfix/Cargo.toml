[package]
name = "babelfix"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "A production-grade FIX protocol implementation in Rust"
readme = "README.md"
categories = ["network-programming"]
keywords = ["fix-protocol", "financial", "fix", "trading"]

[features]
default = []
serde = ["dep:serde"]

[dependencies]
futures.workspace = true
async-stream.workspace = true
thiserror.workspace = true
tokio.workspace = true
babelfix-repo.workspace = true
babelfix-repogen.workspace = true
tracing.workspace = true
bytes.workspace = true
tokio-util.workspace = true
chrono.workspace = true
serde = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
anyhow.workspace = true
googletest.workspace = true
test-log.workspace = true

[[bench]]
name = "message_benchmarks"
harness = false

[[bench]]
name = "channel_benchmarks"
harness = false
