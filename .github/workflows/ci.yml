name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    # nightly rolls new lints constantly and RUSTFLAGS=-Dwarnings also applies to
    # dependency builds, so allow the nightly entry to fail without failing CI.
    continue-on-error: ${{ matrix.rust == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta, nightly, "1.85.0"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace

  sans-io:
    name: babelfix-core is sans-io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Built on its own, not as part of --workspace: cargo unifies features
      # across a single invocation, so a workspace build would hand the core
      # back `chrono/now` (and anything else babelfix-tokio enables) and the
      # guarantee below would silently stop meaning anything.
      - name: Build the core alone
        run: cargo build -p babelfix-core
      # The core must never grow an async runtime. Without this check, someone
      # adds `futures` for one Stream impl in six months and nobody notices.
      - name: No async runtime in the dependency tree
        run: |
          if cargo tree -p babelfix-core -e normal --prefix none \
              | grep -iE '^(tokio|futures|async-std|smol|async-)' ; then
            echo "::error::babelfix-core has picked up an async runtime dependency"
            exit 1
          fi
      # `Utc::now()` must not exist in the core: the driver supplies the clock.
      # chrono gates it behind the `now` feature, which the core does not enable.
      - name: No wall clock in the core
        run: |
          if cargo tree -p babelfix-core -e features | grep -q 'chrono feature "now"' ; then
            echo "::error::babelfix-core has enabled chrono's clock"
            exit 1
          fi

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -Dwarnings

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      # Fail on broken intra-doc links and other rustdoc lints.
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  # MIRI is disabled because it is too slow on the test suite - proabbly due to
  # parsing the orchestra XMLs.
  # miri:
