[workspace]
resolver = "2"
members = [
  "crates/babelfix",
  "crates/babelfix_repo",
  "crates/babelfix_repogen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
license = "MIT"
authors = ["Ben Jackson <puremourning@gmail.com>"]
repository = "https://github.com/puremourning/babelfix"

[workspace.dependencies]
anyhow = "1.0"
futures = "0.3"
async-stream = "0.3"
tokio = { version = "1.0", features = ["full"] }
babelfix-repo = { path = "crates/babelfix_repo", version = "0.1.0" }
babelfix-repogen = { path = "crates/babelfix_repogen", version = "0.1.0" }
tracing = "0.1"
bytes = "1.0"
tokio-util = { version = "0.7", features = ["codec"] }
chrono = { version = "0.4", features = ["serde"] }
criterion = { version = "0.8" }
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
thiserror = "2.0"
