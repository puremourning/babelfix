[package]
name = "babelfix-tokio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Tokio driver for the babelfix FIX engine: TCP transport, timers and session tasks"
categories = ["network-programming", "asynchronous"]
keywords = ["fix-protocol", "financial", "fix", "trading", "tokio"]

[features]
default = []
serde = ["babelfix-core/serde"]

[dependencies]
babelfix-core.workspace = true
futures.workspace = true
# Only what the driver actually uses: sockets, timers, the session tasks,
# `select!` and the AsyncRead/AsyncWrite extension traits.
tokio = { version = "1.0", default-features = false, features = ["net", "time", "rt", "macros", "io-util"] }
tokio-util.workspace = true
bytes.workspace = true
chrono.workspace = true
tracing.workspace = true
